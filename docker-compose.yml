version: "3.8"

services:
  project-zomboid:
    image: docker.io/sknnr/zomboid-dedicated-server:latest
    container_name: ${PZ_CONTAINER}
    restart: "no"

    environment:
      TZ: Europe/Rome

      # Build 42 Stable:
      # Leave BETA_BRANCH unset to use the public stable branch.

      MAX_MEMORY: "8g"
      MAX_PLAYERS: "16"

      SERVER_NAME: "${PZ_SERVER_NAME}"
      SERVER_PASSWORD: "${PZ_SERVER_PASSWORD}"

      ADMIN_USERNAME: "${PZ_ADMIN_USERNAME}"
      ADMIN_PASSWORD: "${PZ_ADMIN_PASSWORD}"

      GAME_PORT: "16261"
      DIRECT_PORT: "16262"

      PUBLIC: "true"
      PAUSE_EMPTY: "true"
      PVP: "true"
      STEAM_VAC: "true"
      PING_LIMIT: "400"

      AUTOSAVE_INTERVAL: "15"
      BACKUPS_PERIOD: "${PZ_BACKUPS_PERIOD}"
      BACKUPS_COUNT: "${PZ_BACKUPS_COUNT}"

      RCON_PORT: "${PZ_RCON_PORT}"
      RCON_PASSWORD: "${PZ_RCON_PASSWORD}"

      # Automatically generated by generate-mod-list.py
      MOD_IDS: "${PZ_MOD_IDS}"
      MOD_NAMES: "${PZ_MOD_NAMES}"
      MAP_NAMES: "${PZ_MAP_NAMES}"
      MOD_BLACKLIST_WORKSHOP: "${PZ_MOD_BLACKLIST_WORKSHOP:-}"
      MOD_BLACKLIST_MODS: "${PZ_MOD_BLACKLIST_MODS:-}"
      MOD_FORCED_WORKSHOP: "${PZ_MOD_FORCED_WORKSHOP:-}"
      MOD_FORCED_MODS: "${PZ_MOD_FORCED_MODS:-}"

      # Leave enabled unless a mod specifically requires disabling it.
      #ANTI_CHEAT_TYPE21: "true"

    volumes:
      - ${PZ_DEDICATED_SERVER_DIR}:/home/steam/zomboid
      - ${PZ_ZOMBOID_DATA_DIR}:/home/steam/zomboid_data
      - ${PZ_ENTRYPOINT_FILE}:/home/steam/entrypoint.sh:ro

    ports:
      - "16261:16261/udp"
      - "16262:16262/udp"

      # RCON reachable only from the host server.
      - "127.0.0.1:${PZ_RCON_PORT}:${PZ_RCON_PORT}/tcp"

    stop_grace_period: 90s
