# Shared Project Zomboid Mod-ID compatibility policy.
# Server administrators keep their local choices in .env instead.
# Per-Workshop default/optional selection (including a companion enabled only
# when a related Mod ID is active) belongs in MOD_SELECTION_RULES in
# generate-mod-list.py; see README's "Workshop Mod ID selection" section.
# Example: "conditions": [{"any_of": ["RelatedWeaponMod"],
# "select": ["DependentCompatibilityMod"]}]

[mods]
# Known obsolete/alternative IDs from this deployment's supported mod set.
# Comment out or remove an entry to stop excluding it.
always_exclude = [
    "EQUIPMENT_UI",
    "equipmentuipatch",
    "Neat_Building_Buildables_SESCompat",
    "Neat_Building_Railings",
    "Neat_Building_UIOnly",
    "VVA_slowdoors",
    "zHBVCEF",
    "HBACVFE",
    "HBACVFE93",
    "HBACVFES",
]

# Removed variants remain available when an administrator explicitly disables
# their normal counterpart. Rules run in file order against the evolving set.
[[mods.prefer]]
winner = "Waterpipes"
losers = ["WaterpipesRemoved"]
reason = "The normal and Removed Waterpipes variants are mutually exclusive."

[[mods.prefer]]
winner = "FunctionalGutters"
losers = ["FunctionalGuttersRemoved"]
removed_fallback = "FunctionalGuttersRemoved"
reason = "Keep placeholder definitions required by existing saves after removing FunctionalGutters."

[[mods.prefer]]
winner = "WorkingGutters"
losers = ["WorkingGuttersRemoved"]
removed_fallback = "WorkingGuttersRemoved"
reason = "Keep placeholder definitions required by existing saves after removing WorkingGutters."

[[mods.prefer]]
winner = "MinidoracatAutoDriveFor42"
losers = ["Navigator"]
reason = "Minidoracat AutoDrive declares Navigator incompatible; AutoDrive takes precedence when both are present."

# Add [[mods.conflict]] rules for incompatibilities without a universal winner.

[[mods.conflict]]
mods = ["ShotgunSuppressorB42GoM", "ShotgunSuppressorB42GoMOld"]
reason = "Both Guns of Marz suppressor profiles were selected; retain both only when both corresponding Guns of Marz Mod IDs are genuinely active."

[workshop]
# Reserved for future project-wide Workshop-ID rules. Mod-ID rules above do not
# remove Workshop items, because one item may expose multiple active Mod IDs.
always_exclude = []
